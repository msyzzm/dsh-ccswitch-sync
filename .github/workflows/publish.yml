name: publish

# Tag-driven release: pushing `v<version>` publishes the package with provenance.
# Configure the package on npmjs.com as a trusted publisher for this repository
# and this workflow file to publish without any secret; a static NPM_TOKEN is
# the fallback (leave the secret unset to use OIDC).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # npm provenance and trusted publishing both authenticate through OIDC.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Tag matches package.json version
        run: |
          node -e 'const { version } = require("./package.json"); const tag = process.env.GITHUB_REF_NAME; if (tag !== `v${version}`) { console.error(`tag ${tag} does not match v${version}`); process.exit(1) }'

      - name: Checks
        run: |
          node --check lib/index.js
          node --check lib/sync.mjs
          node scripts/check-manifest.mjs
          node --test "test/*.test.mjs"

      - name: Manifest ships in the tarball
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e 'const pack = require(process.argv[1])[0]; for (const want of ["dsh-plugin.json", "cordis.patch.yml"]) { if (!pack.files.some(file => file.path === want)) { console.error(`${want} is not in the tarball`); process.exit(1) } }' "$RUNNER_TEMP/pack.json"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          # Empty when the package uses trusted publishing (OIDC); npm then
          # authenticates through the workflow identity instead of a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npmmirror otherwise lags behind npmjs, and can serve the staged-publish
      # placeholder (0.0.0-stage) as `latest` until it catches up. Two lags stack
      # up: npmjs takes a few minutes to expose a fresh publish, and npmmirror
      # syncs from a replica (r.cnpmjs.org) that trails npmjs further — a sync
      # that runs too early reports success and adds nothing. So wait for npmjs,
      # then keep re-requesting the sync until the mirror itself serves the new
      # `latest`. Best effort: a timeout or a failed request never fails the
      # release.
      - name: Ask npmmirror to sync
        timeout-minutes: 20
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          mirror_latest() {
            curl -fsS "https://registry.npmmirror.com/$name?t=$(date +%s%N)" 2>/dev/null               | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s)["dist-tags"].latest)}catch{}})' || true
          }

          for attempt in $(seq 1 30); do
            latest=$(npm view "$name" dist-tags.latest --prefer-online 2>/dev/null || true)
            if [ "$latest" = "$version" ]; then break; fi
            echo "npmjs latest is '$latest', waiting for $version ($attempt/30)"
            sleep 10
          done
          if [ "$latest" != "$version" ]; then
            echo "::warning::npmjs did not expose $version within 5 minutes; skipping the npmmirror sync"
            exit 0
          fi

          # Each round requests a sync, then gives the mirror a minute to serve it.
          for round in $(seq 1 10); do
            curl -fsS -X PUT "https://registry-direct.npmmirror.com/-/package/$name/syncs" >/dev/null               || echo "npmmirror sync request failed (round $round/10)"
            for check in $(seq 1 6); do
              sleep 10
              mirrored=$(mirror_latest)
              if [ "$mirrored" = "$version" ]; then
                echo "npmmirror serves $version (round $round/10)"
                exit 0
              fi
            done
            echo "npmmirror latest is '$mirrored' after round $round/10; requesting another sync"
          done
          echo "::warning::npmmirror still serves '$mirrored' after 10 minutes; trigger https://npmmirror.com/package/$name manually"
