name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No dependencies: the plugin is plain ESM with zero runtime imports.
      - name: Syntax
        run: node --check lib/index.js && node --check lib/sync.mjs

      - name: Manifest shape
        run: node scripts/check-manifest.mjs

      - name: Tests
        run: node --test "test/*.test.mjs"

      - name: Manifest ships in the tarball
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e 'const pack = require(process.argv[1])[0]; for (const want of ["dsh-plugin.json", "cordis.patch.yml", "lib/index.js"]) { if (!pack.files.some(file => file.path === want)) { console.error(`${want} is not in the tarball`); process.exit(1) } }' "$RUNNER_TEMP/pack.json"
